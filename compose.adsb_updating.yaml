services:
  adsb-updating:
    build:
      context: .
      dockerfile: Dockerfile.adsb_updating
    container_name: adsb-updating
    restart: unless-stopped
    env_file:
      - .env.prod
      - .env
    environment:
      OUTPUT_DIR: /app
      # Compose fails at startup instead of exposing the proxy without auth.
      ADSB_PROXY_TOKEN: ${ADSB_PROXY_TOKEN:?Set ADSB_PROXY_TOKEN in .env}
    ports:
      - "${ADSB_PROXY_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    networks:
      - default
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

networks:
  default:
    driver: bridge
