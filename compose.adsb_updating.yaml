services:
  adsb-updating:
    build:
      context: .
      dockerfile: Dockerfile.adsb_updating
    container_name: adsb-updating
    restart: unless-stopped
    env_file:
      - .env.prod
      - .env
    environment:
      OUTPUT_DIR: /app
    volumes:
      - ./data:/app/data
    networks:
      - default
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

networks:
  default:
    driver: bridge
