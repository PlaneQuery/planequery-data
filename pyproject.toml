[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "planequery-data"
version = "0.1.0"

dependencies = [
    "joblib==1.5.3",
    "lightgbm==4.6.0",
    "matplotlib==3.10.7",
    "networkx==3.6.1",
    "numpy==2.5.1",
    "orjson==3.11.9",
    "ortools==9.15.6755",
    "polars==1.42.1",
    "pyarrow==25.0.0",
    "pyspark==4.2.0",
    "scikit-learn==1.9.0",
    "scipy==1.18.0",
    "timezonefinder==8.2.4",
    "boto3==1.43.46",
    "lxml==6.1.1"
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ipykernel==7.3.0",
    "plotly==6.9.0",
    "nbformat==5.10.4"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
